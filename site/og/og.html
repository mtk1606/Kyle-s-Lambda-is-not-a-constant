<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #fbfbfa; color: #111214; font-family: "IBM Plex Sans", "DejaVu Sans", system-ui, sans-serif; position: relative; overflow: hidden; }
  .pad { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; }
  .eyebrow { font-family: "DejaVu Sans Mono", monospace; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; color: #7a7c82; }
  .eyebrow b { color: #1f5fbf; font-weight: 500; }
  h1 { font-family: "Newsreader", "DejaVu Serif", Georgia, serif; font-weight: 500; font-size: 86px; line-height: 1.02; margin: 26px 0 0; letter-spacing: -0.01em; }
  h1 i { color: #1f5fbf; }
  p { font-size: 34px; line-height: 1.3; margin: 26px 0 0; color: #4b4d52; max-width: 20em; }
  .row { margin-top: auto; display: flex; gap: 14px; align-items: center; font-family: "DejaVu Sans Mono", monospace; font-size: 17px; letter-spacing: 0.05em; text-transform: uppercase; }
  .pill { padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
  .ok { background: #e8f4e8; color: #137a13; } .no { background: #fbeae9; color: #b3261e; } .pa { background: #fcf1db; color: #8a5a00; }
  .by { margin-left: auto; text-transform: none; letter-spacing: 0; font-family: "IBM Plex Sans", "DejaVu Sans", sans-serif; font-size: 24px; color: #111214; white-space: nowrap; }
  .lc { text-transform: none; }
</style></head>
<body>
  <div class="pad">
    <div class="eyebrow"><b>Research</b> · Market microstructure</div>
    <h1>Kyle's Lambda Is<br><i>Not</i> a Constant</h1>
    <p>I could forecast price impact. The trading thesis failed.</p>
    <div class="row">
      <span class="pill ok">✓ <span class="lc">λ</span> is forecastable</span>
      <span class="pill no">✕ trading thesis</span>
      <span class="pill pa">△ execution 2 of 4</span>
      <span class="by">By Mohamed El Khoudimi</span>
    </div>
  </div>
</body></html>
