[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kylelambda"
version = "0.1.0"
description = "Kyle's lambda is not a constant: estimator audit, dynamics, signal and economic tests on real trade and L3 data"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
collector = ["websockets>=12"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
